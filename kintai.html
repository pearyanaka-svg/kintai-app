<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勤怠管理</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: linear-gradient(155deg, #060d1a 0%, #0a1525 55%, #0d1f38 100%);
  min-height: 100vh;
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  color: #f1f5f9;
  padding: 20px 14px 60px;
  display: flex;
  justify-content: center;
}
#app { width: 100%; max-width: 580px; }

.hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.logo { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.sync-badge { font-size: 11px; border-radius: 99px; padding: 3px 10px; border: 1px solid; }
.sync-ok  { color: #4ade80; background: #052e16; border-color: #166534; }
.sync-ing { color: #fbbf24; background: #1a1200; border-color: #713f12; }
.sync-err { color: #f87171; background: #1a0808; border-color: #7f1d1d; }

.tabs { display: flex; gap: 4px; background: #0b1628; border-radius: 10px; padding: 4px; border: 1px solid #1a2d4a; margin-bottom: 16px; }
.tab { flex: 1; padding: 9px 0; border: none; background: none; color: #475569; font-size: 14px; font-weight: 700; border-radius: 7px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.tab.on { background: #1a3559; color: #60a5fa; }

.mbar { display: flex; align-items: center; justify-content: space-between; background: #0b1628; border: 1px solid #1a2d4a; border-radius: 12px; padding: 10px 16px; margin-bottom: 20px; }
.marrow { background: none; border: none; color: #3b82f6; font-size: 26px; cursor: pointer; padding: 0 8px; font-weight: 300; line-height: 1; }
.msel { background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; padding: 4px 8px; color: #94a3b8; font-size: 13px; font-family: inherit; outline: none; }
.mlabel { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; }

.card { background: linear-gradient(135deg, #0f1e38, #0b1525); border: 1px solid #1a3559; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
.card-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.emp-name { font-weight: 800; font-size: 16px; }
.pill { font-size: 12px; border: 1px solid; border-radius: 99px; padding: 3px 10px; }
.wage-pill { color: #60a5fa; border-color: #1a3a6a; background: #0f2a4a; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 12px; }
.cal-h { text-align: center; font-size: 10px; font-weight: 700; padding: 3px 0; color: #334155; }
.cal-h.sun { color: #f87171; } .cal-h.sat { color: #60a5fa; }
.cal-cell { display: flex; flex-direction: column; align-items: center; padding: 4px 2px; border-radius: 7px; background: #080f1e; }
.cal-cell.today { background: #0f2448; border: 1px solid #1e4a9a; }
.day-num { font-size: 10px; font-weight: 600; color: #475569; margin-bottom: 2px; }
.day-num.sun { color: #f87171; } .day-num.sat { color: #60a5fa; }
.h-in { width: 100%; background: transparent; border: none; border-bottom: 1px solid #1e2d40; color: #475569; font-size: 12px; text-align: center; padding: 2px 0; outline: none; font-family: inherit; }
.h-in.filled { color: #f1f5f9; border-bottom-color: #3b82f6; }
.h-in::placeholder { color: #1e2d40; }
.card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #1a2d4a; }

.stat-grid { display: flex; gap: 8px; }
.stat-box { flex: 1; background: #070e1c; border: 1px solid #1a2d4a; border-radius: 10px; padding: 11px 6px; text-align: center; }
.stat-val { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat-lbl { font-size: 10px; color: #475569; margin-top: 3px; }

.daily-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #0b1525; }

.section-title { font-size: 10px; letter-spacing: 0.22em; color: #334155; text-transform: uppercase; margin-bottom: 10px; }
.add-form { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; }
.inp { background: #070e1c; border: 1px solid #1a2d4a; border-radius: 8px; padding: 10px 12px; color: #f1f5f9; font-size: 14px; font-family: inherit; outline: none; }
.btn { border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; transition: opacity 0.15s; }
.btn:active { opacity: 0.8; }
.btn-pri  { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #fff; }
.btn-sec  { background: #1a2d4a; color: #94a3b8; }
.btn-danger { background: #1e0f0f; color: #f87171; border: 1px solid #3f1414; }
.emp-card { background: #0b1525; border: 1px solid #1a2d4a; border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }

.empty { text-align: center; padding: 40px 20px; color: #475569; }
.info-box { margin-top: 24px; padding: 14px; background: #070e1c; border: 1px solid #1a2d4a; border-radius: 12px; font-size: 12px; color: #475569; line-height: 1.9; }

.spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #1a2d4a; border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
input[type=number]::-webkit-inner-spin-button { opacity: 0.3; }
select option { background: #1e293b; color: #f1f5f9; }
#lock-screen {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(155deg, #060d1a 0%, #0a1525 55%, #0d1f38 100%);
  display: flex; align-items: center; justify-content: center;
}
.lock-box { width: 100%; max-width: 340px; padding: 0 20px; text-align: center; }
.lock-icon { font-size: 48px; margin-bottom: 16px; }
.lock-title { font-size: 22px; font-weight: 800; color: #f1f5f9; margin-bottom: 6px; }
.lock-sub { font-size: 13px; color: #475569; margin-bottom: 28px; }
.lock-input {
  width: 100%; background: #070e1c; border: 1px solid #1a2d4a;
  border-radius: 10px; padding: 14px 16px; color: #f1f5f9;
  font-size: 16px; font-family: inherit; outline: none;
  text-align: center; letter-spacing: 0.1em; margin-bottom: 12px;
  transition: border-color 0.2s;
}
.lock-input:focus { border-color: #3b82f6; }
.lock-input.error { border-color: #f87171; animation: shake 0.3s; }
.lock-btn {
  width: 100%; padding: 14px; background: linear-gradient(135deg, #1d4ed8, #3b82f6);
  color: #fff; border: none; border-radius: 10px; font-size: 16px;
  font-weight: 700; cursor: pointer; font-family: inherit;
}
.lock-err { color: #f87171; font-size: 13px; margin-top: 10px; min-height: 20px; }
@keyframes shake {
  0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)}
}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">勤怠管理</div>
    <div class="lock-sub">パスワードを入力してください</div>
    <input class="lock-input" id="pw-input" type="password" placeholder="password"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button class="lock-btn" onclick="checkPw()">ログイン</button>
    <div class="lock-err" id="pw-err"></div>
  </div>
</div>
<script>
const PW = "pear.yanaka";
function checkPw() {
  const val = document.getElementById("pw-input").value;
  if (val === PW) {
    sessionStorage.setItem("kintai_auth","1");
    document.getElementById("lock-screen").style.display = "none";
  } else {
    const inp = document.getElementById("pw-input");
    inp.classList.add("error");
    document.getElementById("pw-err").textContent = "パスワードが違います";
    setTimeout(() => inp.classList.remove("error"), 400);
    inp.value = "";
  }
}
if (sessionStorage.getItem("kintai_auth") === "1") {
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("lock-screen").style.display = "none";
  });
}
</script>

<div id="app"><div class="empty"><div class="spinner"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

// ── Firebase 設定 ──────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyD4V9BBR3I8ZCcjnh8DRa27ZK8h-Fg3JQA",
  authDomain: "part-time-kintai-app.firebaseapp.com",
  databaseURL: "https://part-time-kintai-app-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "part-time-kintai-app",
  storageBucket: "part-time-kintai-app.firebasestorage.app",
  messagingSenderId: "1002569522608",
  appId: "1:1002569522608:web:a825ebeb6f5261179c8a75"
};
const fbApp = initializeApp(firebaseConfig);
const db    = getDatabase(fbApp);

// ── ユーティリティ ──────────────────────────────────────────────────────
function uid()  { return Math.random().toString(36).slice(2,9); }
function yen(n) { return "¥" + Math.floor(n).toLocaleString("ja-JP"); }
function daysInMonth(y,m) { return new Date(y,m,0).getDate(); }
function ds(y,m,d) { return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function weekOf(dateStr) {
  const d=new Date(dateStr);
  return Math.ceil((d.getDate()+new Date(d.getFullYear(),d.getMonth(),1).getDay())/7);
}
const WD=["日","月","火","水","木","金","土"];
const MO=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const todayStr = new Date().toISOString().slice(0,10);
const nowY=new Date().getFullYear(), nowM=new Date().getMonth()+1;

// ── 状態 ───────────────────────────────────────────────────────────────
let state = {
  view: "input",
  employees: [],   // [{id,name,hourlyWage}]
  records: {},     // {"empId_dateStr": hours}
  selY: nowY, selM: nowM,
  syncStatus: "connecting",  // connecting | ok | saving | error
  newName:"", newWage:"",
  editWage:{},
};

// ── ローカルキャッシュから即座に表示 ──────────────────────────────
const CACHE_EMP = "kintai_cache_emp";
const CACHE_REC = "kintai_cache_rec";
try {
  const ce = localStorage.getItem(CACHE_EMP);
  const cr = localStorage.getItem(CACHE_REC);
  if(ce) state.employees = JSON.parse(ce);
  if(cr) state.records   = JSON.parse(cr);
} catch(_) {}
render(); // キャッシュで即表示（Firebaseを待たない）

// ── Firebase リアルタイム同期（バックグラウンドで更新） ────────────
onValue(ref(db,"employees"), snap => {
  state.employees = snap.val() ? Object.values(snap.val()) : [];
  state.syncStatus = "ok";
  try { localStorage.setItem(CACHE_EMP, JSON.stringify(state.employees)); } catch(_){}
  render();
}, err => { state.syncStatus="error"; render(); });

onValue(ref(db,"records"), snap => {
  state.records = snap.val() || {};
  try { localStorage.setItem(CACHE_REC, JSON.stringify(state.records)); } catch(_){}
  render();
});

async function saveEmployees(emps) {
  state.syncStatus="saving"; render();
  const obj={};
  emps.forEach(e=>{ obj[e.id]=e; });
  await set(ref(db,"employees"), obj);
  state.syncStatus="ok";
}
async function saveRecord(empId, dateStr, hours) {
  const key=`${empId}_${dateStr}`.replace(/[.#$[\]]/g,"-");
  if(hours===null||hours===undefined||hours==="") {
    await remove(ref(db,`records/${key}`));
  } else {
    await set(ref(db,`records/${key}`), Number(hours));
  }
}

// ── 集計 ───────────────────────────────────────────────────────────────
function getStats(empId,y,m){
  const emp=state.employees.find(e=>e.id===empId);
  const days=daysInMonth(y,m);
  let total=0,dc=0; const wm={};
  for(let d=1;d<=days;d++){
    const key=`${empId}_${ds(y,m,d)}`.replace(/[.#$[\]]/g,"-");
    const h=state.records[key]??0;
    if(h>0){ total+=h; dc++; const w=weekOf(ds(y,m,d)); wm[w]=(wm[w]||0)+h; }
  }
  const wv=Object.values(wm);
  return { total, weekAvg:wv.length?wv.reduce((a,b)=>a+b,0)/wv.length:0,
           pay:(emp?emp.hourlyWage:0)*total, daysWorked:dc };
}

// ── レンダリング ────────────────────────────────────────────────────────
function render(){
  document.getElementById("app").innerHTML = buildHTML();
  attachEvents();
}

function syncBadge(){
  const map={
    connecting:["接続中…","sync-ing"],
    ok:["● 同期済","sync-ok"],
    saving:["同期中…","sync-ing"],
    error:["接続エラー","sync-err"],
  };
  const [label,cls]=map[state.syncStatus]||map.ok;
  return `<span class="sync-badge ${cls}">${label}</span>`;
}

function buildHTML(){
  const {view,selY,selM,employees,records}=state;
  const days=daysInMonth(selY,selM);
  const isConnecting = state.syncStatus === "connecting";
  const yearOpts=[nowY-1,nowY,nowY+1].map(y=>`<option value="${y}"${y===selY?" selected":""}>${y}年</option>`).join("");

  // ─ Header & Tabs ─
  let html=`
  <div class="hdr">
    <div class="logo">⏱ 勤怠管理</div>
    ${syncBadge()}
  </div>
  <div class="tabs">
    <button class="tab${view==="input"?" on":""}" onclick="sv('input')">時間入力</button>
    <button class="tab${view==="report"?" on":""}" onclick="sv('report')">レポート</button>
    <button class="tab${view==="manage"?" on":""}" onclick="sv('manage')">従業員</button>
  </div>`;

  // Month bar
  if(view==="input"||view==="report"){
    html+=`
    <div class="mbar">
      <button class="marrow" onclick="prevM()">‹</button>
      <div class="mlabel">
        <select class="msel" onchange="setY(this.value)">${yearOpts}</select>
        <span>${MO[selM-1]}</span>
      </div>
      <button class="marrow" onclick="nextM()">›</button>
    </div>`;
  }

  // ─ INPUT view ─
  if(view==="input"){
    if(employees.length===0){
      html+=`<div class="empty">
        <div style="font-size:36px;margin-bottom:10px">👤</div>
        <div style="font-size:14px;line-height:1.9">まず「従業員」タブで<br>スタッフを登録してください</div>
        <button class="btn btn-pri" style="margin-top:16px" onclick="sv('manage')">従業員を登録する</button>
      </div>`;
    } else {
      employees.forEach(emp=>{
        const {total,pay}=getStats(emp.id,selY,selM);
        const firstDow=new Date(ds(selY,selM,1)).getDay();
        let calCells=WD.map((w,i)=>`<div class="cal-h${i===0?" sun":i===6?" sat":""}">${w}</div>`).join("");
        for(let i=0;i<firstDow;i++) calCells+=`<div></div>`;
        for(let d=1;d<=days;d++){
          const dateS=ds(selY,selM,d);
          const wd=new Date(dateS).getDay();
          const key=`${emp.id}_${dateS}`.replace(/[.#$[\]]/g,"-");
          const val=records[key]??"";
          const isTod=dateS===todayStr;
          calCells+=`
          <div class="cal-cell${isTod?" today":""}">
            <div class="day-num${wd===0?" sun":wd===6?" sat":""}">${d}</div>
            <input class="h-in${val>0?" filled":""}" type="number" min="0" max="24" step="0.5"
              placeholder="—" value="${val}"
              onchange="setH('${emp.id}','${dateS}',this.value)"
              onfocus="this.select()">
          </div>`;
        }
        html+=`
        <div class="card">
          <div class="card-hdr">
            <span class="emp-name">${emp.name}</span>
            <span class="pill wage-pill">時給 ${yen(emp.hourlyWage)}</span>
          </div>
          <div class="cal">${calCells}</div>
          <div class="card-footer">
            <span style="color:#94a3b8;font-size:13px">合計 <strong style="color:#f1f5f9">${total.toFixed(1)}h</strong></span>
            <strong style="color:#fbbf24;font-size:16px">${yen(pay)}</strong>
          </div>
        </div>`;
      });
      html+=`<div style="text-align:center;color:#334155;font-size:11px;margin-top:4px">
        ※ 入力は自動でリアルタイム同期されます
      </div>`;
    }
  }

  // ─ REPORT view ─
  if(view==="report"){
    if(employees.length===0){
      html+=`<div class="empty" style="color:#475569">従業員が登録されていません</div>`;
    } else {
      // ── 月次サマリー（全員合計） ──
      let totalStaffDays=0, totalAllHours=0, totalAllPay=0;
      employees.forEach(emp=>{
        const s=getStats(emp.id,selY,selM);
        totalStaffDays+=s.daysWorked;
        totalAllHours+=s.total;
        totalAllPay+=s.pay;
      });
      html+=`
      <div style="background:linear-gradient(135deg,#0f2040,#0a1a30);border:1px solid #1e4a8a;border-radius:16px;padding:18px;margin-bottom:20px">
        <div class="section-title" style="color:#2a4a7a;margin-bottom:14px">${selY}年${MO[selM-1]} 月次サマリー</div>
        <div style="display:flex;gap:8px">
          <div style="flex:1;background:#070e1c;border:1px solid #1a2d4a;border-radius:10px;padding:12px 6px;text-align:center">
            <div style="font-size:22px;font-weight:800;color:#f97316;font-variant-numeric:tabular-nums">${totalStaffDays}<span style="font-size:12px;color:#64748b;margin-left:2px">人日</span></div>
            <div style="font-size:10px;color:#475569;margin-top:3px">のべ人数</div>
          </div>
          <div style="flex:1;background:#070e1c;border:1px solid #1a2d4a;border-radius:10px;padding:12px 6px;text-align:center">
            <div style="font-size:22px;font-weight:800;color:#a78bfa;font-variant-numeric:tabular-nums">${totalAllHours.toFixed(1)}<span style="font-size:12px;color:#64748b;margin-left:2px">h</span></div>
            <div style="font-size:10px;color:#475569;margin-top:3px">のべ勤務時間</div>
          </div>
          <div style="flex:1;background:#070e1c;border:1px solid #1a2d4a;border-radius:10px;padding:12px 6px;text-align:center">
            <div style="font-size:22px;font-weight:800;color:#fbbf24;font-variant-numeric:tabular-nums;word-break:break-all">${yen(totalAllPay)}</div>
            <div style="font-size:10px;color:#475569;margin-top:3px">支払い合計</div>
          </div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="section-title" style="margin-bottom:0">スタッフ別明細</div>
        <button onclick="downloadAllCSV()" style="padding:8px 14px;background:#0a1e10;border:1px solid #166534;border-radius:8px;color:#4ade80;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">
          ⬇️ 全員CSVダウンロード
        </button>
      </div>`;

      employees.forEach(emp=>{
        const {total,weekAvg,pay,daysWorked}=getStats(emp.id,selY,selM);
        const detail=[];
        for(let d=1;d<=days;d++){
          const dateS=ds(selY,selM,d);
          const key=`${emp.id}_${dateS}`.replace(/[.#$[\]]/g,"-");
          const h=records[key]??0;
          if(h>0) detail.push({d,dateS,h,wd:new Date(dateS).getDay()});
        }
        let detailHTML="";
        if(detail.length>0){
          detailHTML=`<div style="margin-top:14px">
            <div class="section-title">日別明細</div>
            ${detail.map(({d,h,wd})=>`
            <div class="daily-row">
              <span style="color:${wd===0?"#f87171":wd===6?"#60a5fa":"#94a3b8"};font-size:13px;min-width:74px">${selM}/${d}(${WD[wd]})</span>
              <span style="color:#f1f5f9;font-weight:700;font-size:14px">${h}h</span>
              <span style="color:#64748b;font-size:13px">${yen(h*emp.hourlyWage)}</span>
            </div>`).join("")}
          </div>`;
        } else {
          detailHTML=`<div style="text-align:center;color:#334155;font-size:13px;padding-top:4px">この月の記録はありません</div>`;
        }
        html+=`
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #1a2d4a">
            <div>
              <div style="font-weight:800;font-size:17px">${emp.name}</div>
              <div style="font-size:12px;color:#475569;margin-top:3px">時給 ${yen(emp.hourlyWage)}/h</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:26px;font-weight:800;color:#fbbf24">${yen(pay)}</div>
              <div style="font-size:11px;color:#475569">${selY}年${MO[selM-1]}の給与</div>
            </div>
          </div>
          <div class="stat-grid">
            <div class="stat-box"><div class="stat-val" style="color:#a78bfa">${total.toFixed(1)}h</div><div class="stat-lbl">月間勤務</div></div>
            <div class="stat-box"><div class="stat-val" style="color:#34d399">${weekAvg.toFixed(1)}h</div><div class="stat-lbl">週平均</div></div>
            <div class="stat-box"><div class="stat-val" style="color:#60a5fa">${daysWorked}日</div><div class="stat-lbl">出勤日数</div></div>
          </div>
          ${detailHTML}
          <button onclick="downloadCSV('${emp.id}','${emp.name}')" style="margin-top:14px;width:100%;padding:10px;background:#0a1e10;border:1px solid #166534;border-radius:10px;color:#4ade80;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">
            ⬇️ CSVダウンロード
          </button>
        </div>`;
      });
    }
  }

  // ─ MANAGE view ─
  if(view==="manage"){
    html+=`
    <div class="section-title">従業員を追加</div>
    <div class="add-form">
      <input class="inp" id="newName" placeholder="名前" value="${state.newName}" style="flex:2"
        oninput="state.newName=this.value" onkeydown="if(event.key==='Enter')addEmp()">
      <input class="inp" id="newWage" placeholder="時給(円)" type="number" value="${state.newWage}" style="flex:1"
        oninput="state.newWage=this.value" onkeydown="if(event.key==='Enter')addEmp()">
      <button class="btn btn-pri" onclick="addEmp()">追加</button>
    </div>
    <div class="section-title">従業員一覧</div>`;

    if(employees.length===0){
      html+=`<div class="empty"><div style="font-size:14px">まだ登録されていません</div></div>`;
    } else {
      employees.forEach(emp=>{
        html+=`
        <div class="emp-card">
          <div>
            <div style="font-weight:700;font-size:15px">${emp.name}</div>
            <div style="font-size:12px;color:#64748b;margin-top:2px">時給: <span style="color:#fbbf24">${yen(emp.hourlyWage)}</span></div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <input class="inp" placeholder="新時給" type="number" value="${state.editWage[emp.id]||""}"
              style="width:86px;font-size:13px;padding:7px 9px"
              oninput="state.editWage['${emp.id}']=this.value">
            <button class="btn btn-sec" style="font-size:12px;padding:7px 11px" onclick="updateWage('${emp.id}')">更新</button>
            <button class="btn btn-danger" style="font-size:12px;padding:7px 11px" onclick="removeEmp('${emp.id}')">削除</button>
          </div>
        </div>`;
      });
    }

    html+=`
    <div class="info-box">
      ℹ️ 入力した勤務時間はFirebaseに自動保存され、<strong style="color:#64748b">このHTMLファイルを開いた全デバイスでリアルタイム共有</strong>されます。<br>
      HTMLファイルをiCloud Driveに置いてリンクを共有するだけで、全員が同じデータを使えます。
    </div>`;
  }

  return html;
}

// ── イベントハンドラ（グローバル） ──────────────────────────────────────
window.state  = state;
window.sv     = v => { state.view=v; render(); };
window.prevM  = () => { if(state.selM===1){state.selM=12;state.selY--;}else state.selM--; render(); };
window.nextM  = () => { if(state.selM===12){state.selM=1;state.selY++;}else state.selM++; render(); };
window.setY   = v => { state.selY=Number(v); render(); };
window.setH   = async(empId,dateS,val)=>{
  const h = val===""?null:Math.max(0,Math.min(24,parseFloat(val)||0));
  await saveRecord(empId,dateS,h);
};
window.addEmp = async()=>{
  const name=state.newName.trim(), wage=Number(state.newWage);
  if(!name||!wage) return;
  const emp={id:uid(),name,hourlyWage:wage};
  await saveEmployees([...state.employees,emp]);
  state.newName=""; state.newWage="";
};
window.removeEmp = async id=>{
  if(!confirm("削除しますか？")) return;
  await saveEmployees(state.employees.filter(e=>e.id!==id));
  // records側も削除
  const keys=Object.keys(state.records).filter(k=>k.startsWith(id));
  await Promise.all(keys.map(k=>remove(ref(db,`records/${k}`))));
};
window.updateWage = async id=>{
  const w=Number(state.editWage[id]); if(!w) return;
  await saveEmployees(state.employees.map(e=>e.id===id?{...e,hourlyWage:w}:e));
  state.editWage[id]="";
};

window.downloadAllCSV = () => {
  const {selY, selM, records, employees} = state;
  const MO2 = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

  let rows = [
    [`${selY}年${MO2[selM-1]} 月次給与レポート`],
    [],
    [`氏名`, `出勤日数`, `合計勤務時間(h)`, `時給(円)`, `支払い合計(円)`],
  ];

  let grandDays=0, grandHours=0, grandPay=0;

  employees.forEach(emp => {
    const days = new Date(selY, selM, 0).getDate();
    let totalH=0, dc=0;
    for(let d=1; d<=days; d++){
      const dateS = `${selY}-${String(selM).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const key = `${emp.id}_${dateS}`.replace(/[.#$[\]]/g,"-");
      const h = records[key] ?? 0;
      if(h>0){ totalH+=h; dc++; }
    }
    const pay = Math.floor(totalH * emp.hourlyWage);
    rows.push([emp.name, dc, totalH.toFixed(1), emp.hourlyWage, pay]);
    grandDays+=dc; grandHours+=totalH; grandPay+=pay;
  });

  rows.push([]);
  rows.push([`合計`, grandDays, grandHours.toFixed(1), ``, grandPay]);

  const bom = '﻿';
  const csv = bom + rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("
");
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `月次給与レポート_${selY}${String(selM).padStart(2,"0")}.csv`;
  a.click();
  URL.revokeObjectURL(url);
};

window.downloadCSV = (empId, empName) => {
  const {selY, selM, records, employees} = state;
  const emp = employees.find(e=>e.id===empId);
  if(!emp) return;
  const days = new Date(selY, selM, 0).getDate();
  const WD2 = ["日","月","火","水","木","金","土"];
  const MO2 = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

  let rows = [
    [`${selY}年${MO2[selM-1]} 勤務レポート`],
    [`氏名`, emp.name],
    [`時給`, emp.hourlyWage],
    [],
    [`日付`, `曜日`, `勤務時間(h)`, `金額(円)`],
  ];
  let totalH = 0;
  for(let d=1; d<=days; d++){
    const dateS = `${selY}-${String(selM).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const key = `${empId}_${dateS}`.replace(/[.#$[\]]/g,"-");
    const h = records[key] ?? 0;
    if(h > 0){
      const wd = new Date(dateS).getDay();
      rows.push([`${selM}/${d}`, WD2[wd], h, Math.floor(h * emp.hourlyWage)]);
      totalH += h;
    }
  }
  rows.push([]);
  rows.push([`合計`, ``, totalH.toFixed(1), Math.floor(totalH * emp.hourlyWage)]);

  const bom = '﻿';
  const csv = bom + rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("
");
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `勤務レポート_${emp.name}_${selY}${String(selM).padStart(2,"0")}.csv`;
  a.click();
  URL.revokeObjectURL(url);
};

function attachEvents(){ /* inline onclickで対応済み */ }
