<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef3f9">
<title>谷中梨園 気象データ</title>
<style>
:root{
  --navy:#16294a;
  --navy-2:#22406e;
  --ink:#0f1f38;
  --sky:#7fb4dc;
  --sky-2:#a9cde8;
  --sky-3:#5b8fc7;
  --mist:#eef3f9;
  --line:#dde6f1;
  --muted:#7c8ca3;
  --white:#fff;
  --up:#c0562f;
  --down:#2f7ba8;
  --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:linear-gradient(180deg,#f7fafd 0%,#eaf1f8 100%);
  background-attachment:fixed;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding:0 0 64px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{padding:20px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-size:12px;letter-spacing:.22em;color:var(--muted);font-weight:700}
.place{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.iconbtn{
  border:1px solid var(--line);background:var(--white);color:var(--navy);
  width:40px;height:40px;border-radius:14px;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.iconbtn:active{transform:scale(.95)}
.row-btns{display:flex;gap:8px}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(22,41,74,.04)}
.card.tight{padding:14px 16px}

/* --- 今日 --- */
.today{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);margin-bottom:14px}
.today > div{background:var(--white);padding:16px 18px}
.today .lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.today .val{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:2px;line-height:1.1}
.today .val small{font-size:14px;font-weight:700;margin-left:3px;color:var(--navy-2)}

/* --- セグメント --- */
.seg-label{font-size:12px;color:var(--muted);font-weight:700;margin:2px 0 8px}
.seg{display:flex;background:var(--mist);border-radius:14px;padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:1 1 auto;white-space:nowrap;border:0;background:transparent;color:var(--navy-2);
  font-size:13.5px;font-weight:700;padding:10px 10px;border-radius:11px;cursor:pointer;font-family:inherit;
  transition:background .18s,color .18s;
}
.seg button.on{background:var(--navy);color:var(--white);box-shadow:0 2px 6px rgba(22,41,74,.22)}
.seg + .seg-label{margin-top:16px}
.range{display:none;gap:8px;margin-top:10px}
.range.show{display:flex}
.range input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:14px;background:var(--white);color:var(--ink)}

/* --- ヒーロー --- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px;margin-bottom:14px;color:var(--ink);background:linear-gradient(140deg,#8fbde1 0%,#aed2ea 55%,#c5dff0 100%)}
.hero .ring{position:absolute;border-radius:50%;border:44px solid rgba(255,255,255,.13);pointer-events:none}
.hero .r1{width:300px;height:300px;right:-90px;top:-130px}
.hero .r2{width:190px;height:190px;right:-30px;top:-70px;border-width:30px;border-color:rgba(255,255,255,.10)}
.hero .eyebrow{position:relative;font-size:12.5px;font-weight:700;color:#2c4c74;letter-spacing:.04em}
.hero .cap{position:relative;font-size:15px;font-weight:700;margin-top:14px;color:#1d3455}
.hero .big{position:relative;font-size:52px;font-weight:800;letter-spacing:-.035em;line-height:1;margin-top:4px;color:var(--navy)}
.hero .big small{font-size:22px;font-weight:800;margin-left:2px}
.hero .rows{position:relative;margin-top:20px}
.hero .rw{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid rgba(28,55,90,.16);font-size:14px}
.hero .rw span{color:#2c4c74;font-weight:600}
.hero .rw b{font-size:17px;font-weight:800}

/* --- 比較 --- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h .eyebrow{font-size:11px;letter-spacing:.2em;font-weight:800;color:var(--muted)}
.sec-h .note{font-size:11.5px;color:var(--muted)}
.sec-t{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:2px 0 12px}
table.cmp{width:100%;border-collapse:collapse;font-size:14px}
table.cmp th{font-size:11px;color:var(--muted);font-weight:700;text-align:right;padding:0 0 8px;letter-spacing:.03em}
table.cmp th:first-child{text-align:left}
table.cmp td{padding:11px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.cmp td:first-child{text-align:left;color:var(--navy-2);font-weight:600}
table.cmp td.cur{font-weight:800;color:var(--navy)}
table.cmp td.past{color:#5c6f88}
.delta{display:block;font-size:11px;font-weight:700;margin-top:2px}
.delta.up{color:var(--up)}
.delta.down{color:var(--down)}
.delta.flat{color:var(--muted)}

/* --- チャート --- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:#5c6f88;font-weight:600}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* --- 予報 --- */
.fc{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fc::-webkit-scrollbar{display:none}
.fc .d{flex:0 0 auto;width:66px;text-align:center;background:var(--mist);border-radius:14px;padding:10px 4px}
.fc .d .dd{font-size:11px;color:var(--muted);font-weight:700}
.fc .d .tt{font-size:14px;font-weight:800;margin-top:5px}
.fc .d .tt em{font-style:normal;color:#8d9cb2;font-weight:700;font-size:12px}
.fc .d .pp{font-size:11px;font-weight:700;color:var(--sky-3);margin-top:4px}

/* --- 設定 --- */
.panel{display:none}
.panel.show{display:block}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-family:inherit;font-size:15px;background:var(--white);color:var(--ink)}
.fld .hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;background:var(--navy);color:var(--white)}
.btn.ghost{background:var(--white);color:var(--navy);border:1px solid var(--line)}
.btn+.btn{margin-top:8px}

.status{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 0 18px;line-height:1.6}
.status b{color:var(--navy-2);font-weight:700}
.warn{background:#fff6ed;border-color:#f2dcc4;color:#8a5a2b;font-size:13px;line-height:1.6}
.skel{height:120px;border-radius:var(--radius);background:linear-gradient(90deg,#eef3f9,#f7fafd,#eef3f9);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:14px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="brand">YANAKA ORCHARD</div>
      <div class="place" id="placeName">結城・谷中梨園</div>
    </div>
    <div class="row-btns">
      <button class="iconbtn" id="btnReload" title="最新データを取得">↻</button>
      <button class="iconbtn" id="btnGear" title="設定">⚙</button>
    </div>
  </header>

  <!-- 設定 -->
  <div class="card panel" id="panel">
    <div class="sec-t" style="margin-top:0">設定</div>
    <div class="two">
      <div class="fld"><label>緯度</label><input id="fLat" type="number" step="0.0001" inputmode="decimal"></div>
      <div class="fld"><label>経度</label><input id="fLon" type="number" step="0.0001" inputmode="decimal"></div>
    </div>
    <div class="two">
      <div class="fld"><label>満開日（今年）</label><input id="fBloom" type="date"></div>
      <div class="fld"><label>満開日（昨年）</label><input id="fBloomLast" type="date"></div>
    </div>
    <div class="fld">
      <label>積算温度の計算方式</label>
      <select id="fMode">
        <option value="simple">単純積算（日平均気温の合計）</option>
        <option value="effective">有効積算温度（基準温度を差し引く）</option>
      </select>
    </div>
    <div class="fld" id="baseWrap">
      <label>基準温度（℃）</label>
      <input id="fBase" type="number" step="0.5" inputmode="decimal">
      <div class="hint">有効積算温度は各日「日平均気温 − 基準温度」を合計します（マイナスの日は0扱い）。梨では5℃または10℃が使われます。</div>
    </div>
    <div class="fld">
      <label>降雨日数のしきい値（mm以上）</label>
      <input id="fRain" type="number" step="0.5" inputmode="decimal">
    </div>
    <button class="btn" id="btnSave">設定を保存して再計算</button>
    <button class="btn ghost" id="btnClear">キャッシュを削除して再取得</button>
  </div>

  <!-- 今日 -->
  <div class="today" id="today"></div>

  <!-- 期間・表示情報 -->
  <div class="card tight">
    <div class="seg-label">期間</div>
    <div class="seg" id="segPeriod">
      <button data-v="30" class="on">30日</button>
      <button data-v="custom">指定期間</button>
      <button data-v="year">今年</button>
      <button data-v="bloom">満開日から</button>
    </div>
    <div class="range" id="rangeRow">
      <input id="fFrom" type="date"><input id="fTo" type="date">
    </div>
    <div class="seg-label">表示情報</div>
    <div class="seg" id="segView">
      <button data-v="all" class="on">全部</button>
      <button data-v="prcp">降水量</button>
      <button data-v="temp">気温</button>
      <button data-v="gdd">積算温度</button>
      <button data-v="sun">日照・湿度</button>
    </div>
  </div>

  <div id="body"><div class="skel"></div><div class="skel"></div></div>

  <div class="status" id="status">読み込み中…</div>
</div>

<script>
"use strict";
/* ============================================================
   谷中梨園 気象データ
   データ: Open-Meteo (予報API + アーカイブAPI / ERA5)
   保存:  localStorage
   ============================================================ */

const CFG_KEY  = 'yanaka_wx_cfg_v1';
const HIST_KEY = 'yanaka_wx_hist_v1';
const RECT_KEY = 'yanaka_wx_recent_v1';
const NORM_YEARS = 5;              // 「平年」= 直近5年平均
const IDX = {TMAX:0, TMIN:1, TMEAN:2, PRCP:3, SUN:4, RH:5};

const DEFAULTS = {
  lat:36.3055, lon:139.8772, place:'結城・谷中梨園',
  bloom:'', bloomLast:'',
  gddMode:'effective', gddBase:10, rainMin:1.0
};

/* ---------- 小道具 ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const p2 = n=>String(n).padStart(2,'0');
const toUTC = s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};
const fromUTC = t=>new Date(t).toISOString().slice(0,10);
const addDays = (s,n)=>fromUTC(toUTC(s)+n*86400000);
const diffDays = (a,b)=>Math.round((toUTC(b)-toUTC(a))/86400000);
function todayISO(){const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function shiftYear(s,n){
  const [y,m,d]=s.split('-').map(Number);
  const yy=y-n;
  const dim=new Date(Date.UTC(yy,m,0)).getUTCDate();
  return `${yy}-${p2(m)}-${p2(Math.min(d,dim))}`;
}
const md = s=>{const[,m,d]=s.split('-');return `${Number(m)}/${Number(d)}`;};
const fmt=(v,d=1)=>(v==null||!isFinite(v))?'—':v.toFixed(d);
function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}

/* ---------- 状態 ---------- */
let cfg = Object.assign({}, DEFAULTS, load(CFG_KEY,{}));
let DATA = {};                 // {'YYYY-MM-DD':[tmax,tmin,tmean,prcp,sunH,rh]}
let period = '30';
let view = 'all';
let custom = {from:addDays(todayISO(),-29), to:todayISO()};
let statusMsg = '';

/* ---------- 取得 ---------- */
const VARIANTS = [
  'temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,sunshine_duration,relative_humidity_2m_mean',
  'temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,sunshine_duration',
  'temperature_2m_max,temperature_2m_min,precipitation_sum,sunshine_duration',
  'temperature_2m_max,temperature_2m_min,precipitation_sum'
];

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  if(j.error) throw new Error(j.reason||'API error');
  return j;
}
async function fetchWithFallback(base){
  let last;
  for(const v of VARIANTS){
    try{ return await getJSON(base + encodeURIComponent(v)); }
    catch(e){ last = e; }
  }
  throw last;
}
function parseDaily(j){
  const out = {};
  const d = j.daily; if(!d || !d.time) return out;
  const g = k => d[k] || [];
  const tmax=g('temperature_2m_max'), tmin=g('temperature_2m_min'), tmean=g('temperature_2m_mean');
  const prcp=g('precipitation_sum'), sun=g('sunshine_duration'), rh=g('relative_humidity_2m_mean');
  for(let i=0;i<d.time.length;i++){
    const mx = tmax[i]??null, mn = tmin[i]??null;
    let me = tmean[i]??null;
    if(me==null && mx!=null && mn!=null) me = (mx+mn)/2;
    out[d.time[i]] = [
      mx, mn, me,
      prcp[i]??null,
      sun[i]!=null ? sun[i]/3600 : null,   // 秒 → 時間
      rh[i]??null
    ];
  }
  return out;
}
function q(lat,lon){ return `latitude=${lat}&longitude=${lon}&timezone=Asia%2FTokyo`; }

async function fetchHistory(){
  const y = new Date().getFullYear();
  const start = `${y-NORM_YEARS}-01-01`;
  const end   = addDays(todayISO(),-6);          // ERA5は約5日遅れ
  const base = `https://archive-api.open-meteo.com/v1/archive?${q(cfg.lat,cfg.lon)}&start_date=${start}&end_date=${end}&daily=`;
  const data = parseDaily(await fetchWithFallback(base));
  save(HIST_KEY,{lat:cfg.lat,lon:cfg.lon,start,end,at:Date.now(),data});
  return data;
}
async function fetchRecent(){
  const base = `https://api.open-meteo.com/v1/forecast?${q(cfg.lat,cfg.lon)}&past_days=92&forecast_days=14&daily=`;
  const data = parseDaily(await fetchWithFallback(base));
  save(RECT_KEY,{lat:cfg.lat,lon:cfg.lon,at:Date.now(),data});
  return data;
}
function merge(){
  const h = load(HIST_KEY,null), r = load(RECT_KEY,null);
  DATA = Object.assign({}, (h&&h.data)||{}, (r&&r.data)||{});
}
function sameSpot(c){ return c && Math.abs(c.lat-cfg.lat)<1e-6 && Math.abs(c.lon-cfg.lon)<1e-6; }

async function refresh(force){
  merge(); if(Object.keys(DATA).length) render();

  const h = load(HIST_KEY,null), r = load(RECT_KEY,null);
  const needH = force || !sameSpot(h) || !h.data || (Date.now()-h.at > 7*864e5) ||
                h.start !== `${new Date().getFullYear()-NORM_YEARS}-01-01`;
  const needR = force || !sameSpot(r) || !r.data || (Date.now()-r.at > 3600e3);

  if(!needH && !needR){ setStatus(); return; }
  if(!navigator.onLine){ statusMsg='オフラインです。保存済みデータを表示しています。'; setStatus(); return; }

  statusMsg = '最新データを取得中…'; setStatus();
  try{
    const jobs = [];
    if(needH) jobs.push(fetchHistory());
    if(needR) jobs.push(fetchRecent());
    await Promise.all(jobs);
    statusMsg = '';
  }catch(e){
    statusMsg = '取得に失敗しました（'+e.message+'）。保存済みデータを表示しています。';
  }
  merge(); render(); setStatus();
}
function setStatus(){
  const r = load(RECT_KEY,null);
  const when = r ? new Date(r.at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
  $('#status').innerHTML =
    (statusMsg ? statusMsg+'<br>' : '') +
    `最終更新 <b>${when}</b> ／ 出典 Open-Meteo（過去年は ERA5 再解析）`;
}

/* ---------- 期間の組み立て ---------- */
function currentRange(){
  const t = todayISO();
  if(period==='30')     return {from:addDays(t,-29), to:t, label:'直近30日'};
  if(period==='year')   return {from:`${new Date().getFullYear()}-01-01`, to:t, label:'今年（1月1日〜）'};
  if(period==='bloom'){
    if(!cfg.bloom) return null;
    return {from:cfg.bloom, to:t, label:`満開日（${md(cfg.bloom)}）から`};
  }
  return {from:custom.from, to:custom.to, label:`${md(custom.from)}〜${md(custom.to)}`};
}
/** 今年・昨年・平年(5年) の日付列をそろえる */
function buildSeries(){
  const r = currentRange(); if(!r) return null;
  const cur=[];
  for(let d=r.from; diffDays(d,r.to)>=0; d=addDays(d,1)) cur.push(d);
  if(cur.length>400) cur.length=400;

  let last;
  if(period==='bloom' && cfg.bloomLast){
    last = cur.map((_,i)=>addDays(cfg.bloomLast,i));      // 満開日からの経過日数でそろえる
  }else{
    last = cur.map(d=>shiftYear(d,1));
  }
  const norm = [];
  for(let k=1;k<=NORM_YEARS;k++) norm.push(cur.map(d=>shiftYear(d,k)));
  return {range:r, cur, last, norm};
}

/* ---------- 集計 ---------- */
function pick(date,i){ const v=DATA[date]; return v? v[i] : null; }
function gddOf(tmean){
  if(tmean==null) return null;
  if(cfg.gddMode==='simple') return tmean;
  return Math.max(0, tmean - Number(cfg.gddBase));
}
function agg(dates){
  const o={n:0,prcp:0,nP:0,rain:0,maxP:0,tmax:0,nX:0,tmin:0,nN:0,tmean:0,nM:0,gdd:0,nG:0,sun:0,nS:0,rh:0,nR:0};
  for(const d of dates){
    const v=DATA[d]; if(!v) continue;
    o.n++;
    if(v[IDX.PRCP]!=null){o.prcp+=v[IDX.PRCP];o.nP++;if(v[IDX.PRCP]>=Number(cfg.rainMin))o.rain++;if(v[IDX.PRCP]>o.maxP)o.maxP=v[IDX.PRCP];}
    if(v[IDX.TMAX]!=null){o.tmax+=v[IDX.TMAX];o.nX++;}
    if(v[IDX.TMIN]!=null){o.tmin+=v[IDX.TMIN];o.nN++;}
    if(v[IDX.TMEAN]!=null){o.tmean+=v[IDX.TMEAN];o.nM++;const g=gddOf(v[IDX.TMEAN]);if(g!=null){o.gdd+=g;o.nG++;}}
    if(v[IDX.SUN]!=null){o.sun+=v[IDX.SUN];o.nS++;}
    if(v[IDX.RH]!=null){o.rh+=v[IDX.RH];o.nR++;}
  }
  return {
    days:o.n,
    prcp:  o.nP? o.prcp : null,
    rainDays: o.nP? o.rain : null,
    maxP:  o.nP? o.maxP : null,
    tmax:  o.nX? o.tmax/o.nX : null,
    tmin:  o.nN? o.tmin/o.nN : null,
    tmean: o.nM? o.tmean/o.nM : null,
    gdd:   o.nG? o.gdd : null,
    sun:   o.nS? o.sun : null,
    rh:    o.nR? o.rh/o.nR : null
  };
}
/** 平年 = 直近5年の各年集計の平均 */
function aggNormal(normDates){
  const each = normDates.map(agg);
  const keys = ['prcp','rainDays','maxP','tmax','tmin','tmean','gdd','sun','rh'];
  const out={days:null};
  for(const k of keys){
    const vals = each.map(e=>e[k]).filter(v=>v!=null && isFinite(v));
    out[k] = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  }
  out.years = each.filter(e=>e.days>0).length;
  return out;
}
/** 日別の平年値（チャート用） */
function normalDaily(normDates, i){
  const n = normDates[0].length, out=[];
  for(let j=0;j<n;j++){
    const vals=[];
    for(const yr of normDates){ const v=pick(yr[j],i); if(v!=null) vals.push(v); }
    out.push(vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null);
  }
  return out;
}
function cumulate(arr, tf){
  let s=0; return arr.map(v=>{ const x = tf?tf(v):v; if(x==null) return null; s+=x; return s; });
}
function seriesOf(dates,i){ return dates.map(d=>pick(d,i)); }
/** 未来日（予報）はチャート・集計から除く */
function trimFuture(dates){ const t=todayISO(); return dates.filter(d=>diffDays(d,t)>=0); }

/* ---------- チャート ---------- */
function lineChart(series, labels, opts={}){
  const W=340, H=opts.h||180, pl=40, pr=8, pt=10, pb=22;
  const n = labels.length;
  let mn=Infinity, mx=-Infinity;
  series.forEach(s=>s.values.forEach(v=>{ if(v!=null&&isFinite(v)){ if(v<mn)mn=v; if(v>mx)mx=v; }}));
  if(!isFinite(mn)) return '<div class="legend">データがありません</div>';
  if(opts.zero) mn = Math.min(0,mn);
  if(mn===mx){ mn-=1; mx+=1; }
  const pad=(mx-mn)*0.1; mx+=pad; if(!opts.zero) mn-=pad;
  const X = i => n<=1 ? pl : pl + i*(W-pl-pr)/(n-1);
  const Y = v => H-pb - (v-mn)/(mx-mn)*(H-pt-pb);

  let g='';
  for(let k=0;k<=3;k++){
    const v = mn + (mx-mn)*k/3, y=Y(v);
    g += `<line x1="${pl}" y1="${y.toFixed(1)}" x2="${W-pr}" y2="${y.toFixed(1)}" stroke="#e6edf5" stroke-width="1"/>`;
    g += `<text x="${pl-6}" y="${(y+3.5).toFixed(1)}" font-size="9.5" fill="#98a7bb" text-anchor="end">${v.toFixed(v>=100?0:1)}</text>`;
  }
  const ticks = n<=1?[0]:[0, Math.floor((n-1)/2), n-1];
  ticks.forEach(i=>{ g += `<text x="${X(i).toFixed(1)}" y="${H-6}" font-size="9.5" fill="#98a7bb" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${md(labels[i])}</text>`; });

  series.forEach(s=>{
    let d='', open=false;
    s.values.forEach((v,i)=>{
      if(v==null||!isFinite(v)){ open=false; return; }
      d += (open?'L':'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1) + ' ';
      open=true;
    });
    if(d) g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-linecap="round" stroke-linejoin="round"${s.dash?` stroke-dasharray="4 3"`:''}/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function barChart(values, labels, opts={}){
  const W=340, H=opts.h||150, pl=40, pr=8, pt=10, pb=22;
  const n=values.length;
  let mx=0; values.forEach(v=>{ if(v!=null&&v>mx) mx=v; });
  if(mx<=0) mx=1;
  const bw = Math.max(1.5, (W-pl-pr)/n*0.66);
  const X = i => pl + (i+0.5)*(W-pl-pr)/n;
  const Y = v => H-pb - v/mx*(H-pt-pb);
  let g='';
  for(let k=0;k<=2;k++){
    const v=mx*k/2, y=Y(v);
    g += `<line x1="${pl}" y1="${y.toFixed(1)}" x2="${W-pr}" y2="${y.toFixed(1)}" stroke="#e6edf5" stroke-width="1"/>`;
    g += `<text x="${pl-6}" y="${(y+3.5).toFixed(1)}" font-size="9.5" fill="#98a7bb" text-anchor="end">${v.toFixed(v>=10?0:1)}</text>`;
  }
  values.forEach((v,i)=>{
    if(v==null||v<=0) return;
    const y=Y(v);
    g += `<rect x="${(X(i)-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-pb-y).toFixed(1)}" rx="${Math.min(2,bw/2).toFixed(1)}" fill="#5b8fc7"/>`;
  });
  const ticks = n<=1?[0]:[0, Math.floor((n-1)/2), n-1];
  ticks.forEach(i=>{ g += `<text x="${X(i).toFixed(1)}" y="${H-6}" font-size="9.5" fill="#98a7bb" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${md(labels[i])}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
const C_CUR='#16294a', C_LAST='#7fb4dc', C_NORM='#a8b6c9';
function legend(){
  return `<div class="legend">
    <span><i style="background:${C_CUR}"></i>今年</span>
    <span><i style="background:${C_LAST}"></i>昨年</span>
    <span><i style="background:${C_NORM}"></i>平年（直近5年）</span>
  </div>`;
}

/* ---------- 表示部品 ---------- */
function deltaHTML(cur, ref, unit, digits, invert){
  if(cur==null||ref==null||!isFinite(cur)||!isFinite(ref)) return '';
  const d = cur-ref;
  const cls = Math.abs(d) < Math.pow(10,-digits)/2 ? 'flat' : (d>0 ? (invert?'down':'up') : (invert?'up':'down'));
  const sign = d>0?'+':'';
  let pct='';
  if(Math.abs(ref)>0.05) pct = ` (${d>0?'+':''}${Math.round(d/Math.abs(ref)*100)}%)`;
  return `<span class="delta ${cls}">${sign}${d.toFixed(digits)}${unit}${pct}</span>`;
}
function cmpTable(rows, cur, last, norm){
  let html = `<table class="cmp"><thead><tr><th>項目</th><th>今年</th><th>昨年</th><th>平年</th></tr></thead><tbody>`;
  for(const r of rows){
    const c=cur[r.k], l=last[r.k], nv=norm[r.k];
    html += `<tr><td>${r.label}</td>`+
      `<td class="cur">${fmt(c,r.d)}${r.u}</td>`+
      `<td class="past">${fmt(l,r.d)}${r.u}${deltaHTML(c,l,r.u,r.d,r.inv)}</td>`+
      `<td class="past">${fmt(nv,r.d)}${r.u}${deltaHTML(c,nv,r.u,r.d,r.inv)}</td></tr>`;
  }
  return html+'</tbody></table>';
}
function heroCard(eyebrow, cap, big, unit, rows){
  return `<div class="hero">
    <div class="ring r1"></div><div class="ring r2"></div>
    <div class="eyebrow">${eyebrow}</div>
    <div class="cap">${cap}</div>
    <div class="big">${big}<small>${unit}</small></div>
    <div class="rows">${rows.map(r=>`<div class="rw"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
  </div>`;
}
function section(eyebrow, title, inner, note){
  return `<div class="card">
    <div class="sec-h"><div class="eyebrow">${eyebrow}</div>${note?`<div class="note">${note}</div>`:''}</div>
    <div class="sec-t">${title}</div>${inner}</div>`;
}

/* ---------- 描画 ---------- */
function render(){
  renderToday();
  const S = buildSeries();
  const body = $('#body');

  if(!S){
    body.innerHTML = `<div class="card warn">満開日が未入力です。右上の ⚙ から今年の満開日を入力すると、満開日起算の集計ができます。</div>`;
    return;
  }
  const cur = trimFuture(S.cur);
  const idx = cur.length;                       // 今日までの日数
  const last = S.last.slice(0, idx);
  const norm = S.norm.map(a=>a.slice(0, idx));
  const A = agg(cur), B = agg(last), N = aggNormal(norm);
  const labels = cur;

  let html = '';
  const pl = S.range.label;

  if(view==='all' || view==='prcp'){
    html += heroCard(`${cfg.place.split('・').pop()} ・ ${pl}`, '期間降水量', fmt(A.prcp,1), 'mm', [
      [`降雨日数（${cfg.rainMin}mm以上）`, A.rainDays==null?'—':A.rainDays+' 日'],
      ['日最大降水量', fmt(A.maxP,1)+' mm'],
      ['平年との差', A.prcp!=null&&N.prcp!=null ? (A.prcp-N.prcp>=0?'+':'')+fmt(A.prcp-N.prcp,1)+' mm' : '—']
    ]);
    html += section('RAINFALL','降水量の比較',
      cmpTable([
        {k:'prcp',label:'期間降水量',u:'mm',d:1,inv:false},
        {k:'rainDays',label:'降雨日数',u:'日',d:0,inv:false},
        {k:'maxP',label:'日最大降水量',u:'mm',d:1,inv:false}
      ], A, B, N), `${idx}日分`);

    html += section('CUMULATIVE','累積降水量',
      lineChart([
        {values:cumulate(seriesOf(cur,IDX.PRCP)), color:C_CUR},
        {values:cumulate(seriesOf(last,IDX.PRCP)), color:C_LAST, w:1.8},
        {values:cumulate(normalDaily(norm,IDX.PRCP)), color:C_NORM, w:1.8, dash:true}
      ], labels, {zero:true}) + legend());

    html += section('DAILY','日別の降水量（今年）',
      barChart(seriesOf(cur,IDX.PRCP), labels));
  }

  if(view==='all' || view==='temp'){
    html += heroCard(`${pl}`, '期間平均気温', fmt(A.tmean,1), '℃', [
      ['平均最高気温', fmt(A.tmax,1)+' ℃'],
      ['平均最低気温', fmt(A.tmin,1)+' ℃'],
      ['平年との差', A.tmean!=null&&N.tmean!=null ? (A.tmean-N.tmean>=0?'+':'')+fmt(A.tmean-N.tmean,1)+' ℃' : '—']
    ]);
    html += section('TEMPERATURE','気温の比較',
      cmpTable([
        {k:'tmean',label:'平均気温',u:'℃',d:1,inv:false},
        {k:'tmax',label:'平均最高気温',u:'℃',d:1,inv:false},
        {k:'tmin',label:'平均最低気温',u:'℃',d:1,inv:false}
      ], A, B, N), `${idx}日分`);

    html += section('TREND','日平均気温の推移',
      lineChart([
        {values:seriesOf(cur,IDX.TMEAN), color:C_CUR},
        {values:seriesOf(last,IDX.TMEAN), color:C_LAST, w:1.8},
        {values:normalDaily(norm,IDX.TMEAN), color:C_NORM, w:1.8, dash:true}
      ], labels) + legend());
  }

  if(view==='all' || view==='gdd'){
    const modeLbl = cfg.gddMode==='simple' ? '単純積算' : `有効積算（基準${cfg.gddBase}℃）`;
    const bloomDays = cfg.bloom ? diffDays(cfg.bloom, todayISO())+1 : null;
    html += heroCard(`${pl}`, `積算温度 ・ ${modeLbl}`, fmt(A.gdd,0), '℃・日', [
      ['満開後日数', bloomDays!=null? bloomDays+' 日' : '満開日 未入力'],
      ['昨年同期比', A.gdd!=null&&B.gdd!=null ? (A.gdd-B.gdd>=0?'+':'')+fmt(A.gdd-B.gdd,0)+' ℃・日' : '—'],
      ['平年比', A.gdd!=null&&N.gdd!=null ? (A.gdd-N.gdd>=0?'+':'')+fmt(A.gdd-N.gdd,0)+' ℃・日' : '—']
    ]);
    html += section('HEAT UNITS','積算温度の比較',
      cmpTable([{k:'gdd',label:modeLbl,u:'',d:0,inv:false}], A, B, N),
      period==='bloom'&&cfg.bloomLast ? '満開日起算でそろえて比較' : `${idx}日分`);

    html += section('CUMULATIVE','積算温度の推移',
      lineChart([
        {values:cumulate(seriesOf(cur,IDX.TMEAN), gddOf), color:C_CUR},
        {values:cumulate(seriesOf(last,IDX.TMEAN), gddOf), color:C_LAST, w:1.8},
        {values:cumulate(normalDaily(norm,IDX.TMEAN), gddOf), color:C_NORM, w:1.8, dash:true}
      ], labels, {zero:true}) + legend());
  }

  if(view==='all' || view==='sun'){
    html += heroCard(`${pl}`, '期間日照時間', fmt(A.sun,1), 'h', [
      ['1日あたり平均', A.sun!=null&&idx? fmt(A.sun/idx,1)+' h' : '—'],
      ['平均湿度', A.rh!=null? fmt(A.rh,0)+' %' : '—'],
      ['平年との差', A.sun!=null&&N.sun!=null ? (A.sun-N.sun>=0?'+':'')+fmt(A.sun-N.sun,1)+' h' : '—']
    ]);
    const rows=[{k:'sun',label:'日照時間 合計',u:'h',d:1,inv:false}];
    if(A.rh!=null||N.rh!=null) rows.push({k:'rh',label:'平均湿度',u:'%',d:0,inv:false});
    html += section('SUNSHINE','日照・湿度の比較', cmpTable(rows, A, B, N), `${idx}日分`);

    html += section('CUMULATIVE','累積日照時間',
      lineChart([
        {values:cumulate(seriesOf(cur,IDX.SUN)), color:C_CUR},
        {values:cumulate(seriesOf(last,IDX.SUN)), color:C_LAST, w:1.8},
        {values:cumulate(normalDaily(norm,IDX.SUN)), color:C_NORM, w:1.8, dash:true}
      ], labels, {zero:true}) + legend());

    if(A.rh==null){
      html += `<div class="card warn">この地点では日別湿度がAPIから取得できませんでした。他の項目には影響ありません。</div>`;
    }
  }

  html += forecastHTML();
  body.innerHTML = html;
}

function renderToday(){
  const t = todayISO();
  let d = t, v = DATA[t];
  for(let k=0;k<4 && (!v || v[IDX.TMEAN]==null); k++){ d = addDays(t,-k-1); v = DATA[d]; }
  const el = $('#today');
  if(!v){ el.innerHTML = `<div><div class="lbl">気温</div><div class="val">—</div></div><div><div class="lbl">降水量</div><div class="val">—</div></div>`; return; }
  const label = d===t ? '今日' : md(d);
  el.innerHTML =
    `<div><div class="lbl">${label}の平均気温</div><div class="val">${fmt(v[IDX.TMEAN],1)}<small>℃</small></div></div>`+
    `<div><div class="lbl">${label}の降水量</div><div class="val">${fmt(v[IDX.PRCP],1)}<small>mm</small></div></div>`;
}

function forecastHTML(){
  const t = todayISO(); let cells='';
  for(let i=1;i<=7;i++){
    const d = addDays(t,i), v = DATA[d]; if(!v) continue;
    const w = ['日','月','火','水','木','金','土'][new Date(toUTC(d)).getUTCDay()];
    cells += `<div class="d"><div class="dd">${md(d)}(${w})</div>`+
             `<div class="tt">${fmt(v[IDX.TMAX],0)}<em> / ${fmt(v[IDX.TMIN],0)}</em></div>`+
             `<div class="pp">${fmt(v[IDX.PRCP],1)}mm</div></div>`;
  }
  if(!cells) return '';
  return section('FORECAST','この先7日の予報', `<div class="fc">${cells}</div>`);
}

/* ---------- 操作 ---------- */
function bindSeg(sel, onPick){
  $(sel).addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    $$('button', $(sel)).forEach(x=>x.classList.toggle('on', x===b));
    onPick(b.dataset.v);
  });
}
bindSeg('#segPeriod', v=>{
  period = v;
  $('#rangeRow').classList.toggle('show', v==='custom');
  render();
});
bindSeg('#segView', v=>{ view=v; render(); window.scrollTo({top:0,behavior:'smooth'}); });

$('#fFrom').addEventListener('change', e=>{ custom.from=e.target.value; render(); });
$('#fTo').addEventListener('change',   e=>{ custom.to=e.target.value; render(); });

$('#btnGear').addEventListener('click', ()=>{ $('#panel').classList.toggle('show'); fillForm(); });
$('#btnReload').addEventListener('click', ()=>refresh(true));
$('#fMode').addEventListener('change', e=>{ $('#baseWrap').classList.toggle('hidden', e.target.value==='simple'); });

$('#btnSave').addEventListener('click', ()=>{
  const nLat = parseFloat($('#fLat').value), nLon = parseFloat($('#fLon').value);
  const moved = isFinite(nLat)&&isFinite(nLon) && (Math.abs(nLat-cfg.lat)>1e-6||Math.abs(nLon-cfg.lon)>1e-6);
  if(isFinite(nLat)) cfg.lat=nLat;
  if(isFinite(nLon)) cfg.lon=nLon;
  cfg.bloom = $('#fBloom').value;
  cfg.bloomLast = $('#fBloomLast').value;
  cfg.gddMode = $('#fMode').value;
  cfg.gddBase = parseFloat($('#fBase').value)||0;
  cfg.rainMin = parseFloat($('#fRain').value)||0;
  save(CFG_KEY, cfg);
  $('#panel').classList.remove('show');
  if(moved) refresh(true); else render();
});
$('#btnClear').addEventListener('click', ()=>{
  localStorage.removeItem(HIST_KEY); localStorage.removeItem(RECT_KEY);
  DATA={}; refresh(true);
});
function fillForm(){
  $('#fLat').value=cfg.lat; $('#fLon').value=cfg.lon;
  $('#fBloom').value=cfg.bloom; $('#fBloomLast').value=cfg.bloomLast;
  $('#fMode').value=cfg.gddMode; $('#fBase').value=cfg.gddBase; $('#fRain').value=cfg.rainMin;
  $('#baseWrap').classList.toggle('hidden', cfg.gddMode==='simple');
}

/* ---------- 起動 ---------- */
$('#placeName').textContent = cfg.place;
$('#fFrom').value = custom.from; $('#fTo').value = custom.to;
fillForm();
refresh(false);
window.addEventListener('online', ()=>refresh(false));
</script>
